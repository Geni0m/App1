<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roulette JDR"><title>Roulette JDR</title>
<style>
:root{--f:#f3f1ec;--s:#fff;--e:#1d2330;--m:#667085;--l:#d8d4ca;--a:#b8862d;--ai:#fff}
@media(prefers-color-scheme:dark){:root{--f:#12151c;--s:#1a1f29;--e:#ecebe6;--m:#9aa3b2;--l:#2d3442;--a:#d9a441;--ai:#1a1305}}
*{box-sizing:border-box}
body{margin:0;background:var(--f);color:var(--e);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}
h1{font-size:26px;margin:0 0 14px}h2{font-size:16px;margin:24px 0 8px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{width:100%;background:var(--s);border:1px solid var(--l);border-radius:8px;padding:10px}
button{border:1px solid var(--l);background:var(--s);border-radius:8px;padding:10px 14px;font-weight:600}
.go{background:var(--a);color:var(--ai);border:0;width:100%;padding:14px;font-size:18px;margin-top:10px}
#roue{display:block;width:100%;max-width:340px;margin:12px auto 0}
#g{transition:transform 4s cubic-bezier(.12,.6,.1,1);transform-origin:150px 150px}
#res{min-height:56px;text-align:center;font-size:22px;font-weight:700;margin-top:10px}
ul{list-style:none;margin:0;padding:0}li{padding:9px 0;border-top:1px solid var(--l)}
li b{display:block;color:var(--m);font-weight:600;font-size:13px}
.l{display:flex;gap:8px;margin-top:8px}.l>*{flex:1}
details{margin-top:24px;border-top:1px solid var(--l);padding-top:12px}summary{font-weight:650;cursor:pointer}
textarea{min-height:170px}
</style></head><body><main>
<h1>Roulette JDR</h1>
<input id="nom" placeholder="Nom du personnage" aria-label="Nom du personnage">
<h2>Table</h2><select id="sel" aria-label="Table"></select>
<svg id="roue" viewBox="0 -6 300 306"><g id="g"></g><path d="M138 -2h24l-12 24z" fill="var(--a)" stroke="var(--f)"/></svg>
<button class="go" id="go">Lancer la roulette</button>
<div id="res" aria-live="polite"></div>
<h2>Journal de vie</h2><ul id="j"></ul>
<div class="l"><button id="cop">Copier</button><button id="raz">Nouveau personnage</button></div>
<details><summary>Modifier les tables</summary>
<p style="color:var(--m);font-size:14px">Une option par ligne : <b>texte | poids</b>. Plus le poids est grand, plus la case est large et probable.</p>
<textarea id="ed" aria-label="Options de la table"></textarea>
<div class="l"><button id="sv">Enregistrer</button><button id="nv">Nouvelle table</button><button id="sp">Supprimer</button></div>
</details></main>
<script>
const $=i=>document.getElementById(i),K='jdr-';
const lire=(k,d)=>{try{const v=localStorage.getItem(K+k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const ecrire=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const DEF=[
{n:'Origine',o:[['Noble déchu',1],['Paysan',4],['Marchand',3],['Orphelin des rues',3],['Fils de soldat',3],['Étranger exilé',2]]},
{n:'Métier',o:[['Forgeron',3],['Voleur',2],['Soldat',4],['Érudit',2],['Guérisseur',2],['Mercenaire',3],['Aubergiste',3],['Contrebandier',1]]},
{n:'Trait de caractère',o:[['Loyal',3],['Cupide',2],['Curieux',4],['Rancunier',2],['Généreux',3],['Peureux',2],['Têtu',3]]},
{n:'Défaut',o:[['Joueur',2],['Menteur',3],['Colérique',3],['Orgueilleux',3],['Ivrogne',2],['Naïf',3]]},
{n:'Décor',o:[['Cité portuaire',3],['Village de montagne',3],['Capitale en révolte',2],['Forêt interdite',2],['Désert aux ruines',1],['Forteresse assiégée',2]]},
{n:'Événement de vie',o:[['Un héritage inattendu',1],['Une rencontre décisive',4],['Une trahison',3],['Un voyage lointain',3],['Une maladie',2],['Un coup de chance',3],['Une dette',3],['Un deuil',2]]}];
let T=lire('t',DEF),J=lire('j',[]),sel=0,rot=0,occ=false;
const tot=o=>o.reduce((s,x)=>s+x[1],0);
function dessiner(){
 const o=T[sel].o,t=tot(o);let a=-Math.PI/2,h='';
 const p=(r,u)=>(150+r*Math.cos(u)).toFixed(1)+' '+(150+r*Math.sin(u)).toFixed(1);
 o.forEach((x,i)=>{const d=x[1]/t*2*Math.PI,b=a+d,c='hsl('+(i*47%360)+' 36% '+(i%2?38:46)+'%)';
  h+=o.length>1?'<path d="M150 150L'+p(140,a)+'A140 140 0 '+(d>Math.PI?1:0)+' 1 '+p(140,b)+'Z" fill="'+c+'" stroke="var(--s)" stroke-width="2"/>':'<circle cx="150" cy="150" r="140" fill="'+c+'"/>';
  if(d>.25){const m=a+d/2;h+='<text transform="translate('+p(88,m)+') rotate('+(m*180/Math.PI)+')" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#fff">'+esc(x[0].slice(0,16))+'</text>'}
  a=b});
 $('g').innerHTML=h;$('ed').value=o.map(x=>x[0]+' | '+x[1]).join('\n');
}
function menu(){$('sel').innerHTML=T.map((x,i)=>'<option value="'+i+'">'+esc(x.n)+'</option>').join('');$('sel').value=sel}
function journal(){$('j').innerHTML=J.map(x=>'<li><b>'+esc(x.t)+'</b>'+esc(x.r)+'</li>').join('')||'<li>Aucun tirage pour l\u2019instant.</li>'}
$('go').onclick=()=>{
 if(occ)return;const o=T[sel].o,t=tot(o);let r=Math.random()*t,i=0,c=0;
 for(;i<o.length-1;i++){if(r<c+o[i][1])break;c+=o[i][1]}
 const d=(((-r/t*360-rot)%360)+360)%360;rot+=1800+d;occ=true;$('res').textContent='…';
 $('g').style.transform='rotate('+rot+'deg)';
 setTimeout(()=>{occ=false;$('res').textContent=o[i][0];J.push({t:T[sel].n,r:o[i][0]});ecrire('j',J);journal()},4100);
};
$('sel').onchange=e=>{sel=+e.target.value;$('res').textContent='';dessiner()};
$('sv').onclick=()=>{
 const o=$('ed').value.split('\n').map(l=>{const k=l.lastIndexOf('|'),w=k<0?NaN:parseFloat(l.slice(k+1).replace(',','.'));return[(k<0?l:l.slice(0,k)).trim(),w>0?w:1]}).filter(x=>x[0]);
 if(!o.length)return alert('Ajoutez au moins une option.');T[sel].o=o;ecrire('t',T);dessiner();
};
$('nv').onclick=()=>{const n=(prompt('Nom de la nouvelle table ?')||'').trim();if(!n)return;T.push({n,o:[['Option 1',1],['Option 2',1]]});sel=T.length-1;ecrire('t',T);menu();dessiner()};
$('sp').onclick=()=>{if(T.length<2||!confirm('Supprimer la table « '+T[sel].n+' » ?'))return;T.splice(sel,1);sel=0;ecrire('t',T);menu();dessiner()};
$('cop').onclick=()=>{const s=($('nom').value||'Personnage')+'\n\n'+J.map(x=>x.t+' : '+x.r).join('\n');try{navigator.clipboard.writeText(s);$('cop').textContent='Copié'}catch(e){}setTimeout(()=>$('cop').textContent='Copier',1500)};
$('raz').onclick=()=>{if(confirm('Effacer le journal et le nom ?')){J=[];$('nom').value='';ecrire('j',J);ecrire('nom','');journal();$('res').textContent=''}};
$('nom').value=lire('nom','');$('nom').oninput=e=>ecrire('nom',e.target.value);
menu();dessiner();journal();
</script></body></html>
